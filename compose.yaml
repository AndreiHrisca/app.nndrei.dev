services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nndrei}
      POSTGRES_USER: ${POSTGRES_USER:-nndrei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    container_name: nndrei-app-web
    env_file: .env
    expose: ['8000']
    volumes:
      - private_data:/app/private
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - edge
    restart: unless-stopped
  worker:
    build: .
    container_name: nndrei-app-worker
    command: python manage.py qcluster
    env_file: .env
    volumes:
      - private_data:/app/private
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  private_data:

networks:
  edge:
    external: true

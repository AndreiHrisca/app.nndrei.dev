services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nndrei}
      POSTGRES_USER: ${POSTGRES_USER:-nndrei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    container_name: nndrei-app-web
    env_file: .env
    expose: ['8000']
    volumes:
      - private_data:/app/private
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - edge
    restart: unless-stopped
  # MCP connector for Claude (Streamable HTTP + OAuth). Caddy sends /mcp and the
  # OAuth paths here; see docs/fases.md, section 14.
  mcp:
    build: .
    container_name: nndrei-app-mcp
    command: uvicorn core.mcp_server:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
    env_file: .env
    expose: ['8000']
    volumes:
      - private_data:/app/private
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - edge
    restart: unless-stopped
  worker:
    build: .
    container_name: nndrei-app-worker
    command: python manage.py qcluster
    env_file: .env
    volumes:
      - private_data:/app/private
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  # Consultas from nndrei.dev: every 30 s moves portfolio-api's SQLite mailbox into
  # PostgreSQL and empties it (core/inquiry_sync.py). Same uid as portfolio-api
  # (10001), so the 0600 database stays unreadable to anyone else. No ports, no edge.
  inbox-sync:
    build: .
    container_name: nndrei-app-inbox-sync
    command: python manage.py sync_inquiries --loop
    user: '10001:10001'
    env_file: .env
    environment:
      PORTFOLIO_INBOX: /portfolio/portfolio.sqlite3
    volumes:
      - portfolio_inbox:/portfolio
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  private_data:
  # Created by ~/stacks/webs/nndrei-portfolio (service portfolio-api).
  portfolio_inbox:
    external: true
    name: nndrei-portfolio_portfolio-data

networks:
  edge:
    external: true

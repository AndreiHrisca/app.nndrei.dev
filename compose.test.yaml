services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nndrei_test
      POSTGRES_USER: nndrei
      POSTGRES_PASSWORD: local-test-only
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nndrei -d nndrei_test']
      interval: 2s
      retries: 30
  test:
    image: nndrei-business:dev
    user: '1000:1000'
    working_dir: /app
    volumes: ['.:/app']
    environment:
      SECRET_KEY: local-testing-only-not-a-deployment-secret
      DATABASE_URL: postgres://nndrei:local-test-only@db:5432/nndrei_test
      ALLOWED_HOSTS: localhost,testserver,127.0.0.1
      DEBUG: 'True'
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    depends_on:
      db:
        condition: service_healthy
    command: pytest -q
  # Browser checks (Playwright + WebKit/Chromium). Screenshots go to docs/screenshots/mobile/.
  e2e:
    image: nndrei-business:e2e
    build: {context: ., dockerfile: Dockerfile.e2e}
    user: '1000:1000'
    working_dir: /app
    volumes: ['.:/app']
    environment:
      HOME: /tmp
      SECRET_KEY: local-testing-only-not-a-deployment-secret
      DATABASE_URL: postgres://nndrei:local-test-only@db:5432/nndrei_test
      ALLOWED_HOSTS: localhost,testserver,127.0.0.1
      DEBUG: 'True'
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    depends_on:
      db:
        condition: service_healthy
    command: pytest -q tests/e2e -p no:cacheprovider

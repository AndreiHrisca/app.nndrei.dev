<div id="search-progress" class="notice" {% if run.status == 'queued' or run.status == 'running' %}hx-get="{% url 'search_progress' run.public_id %}" hx-trigger="every 3s" hx-swap="outerHTML"{% endif %} role="status">{% if run.status == 'queued' %}Actualización en cola…{% elif run.status == 'running' %}Actualizando {{ run.completed }} / {{ run.total }} combinaciones…{% else %}{{ run.message }}{% endif %}</div>

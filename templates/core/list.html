{% extends 'base.html' %}{% load mobile %}{% block body_class %}page-clients{% endblock %}{% block content %}<header class="desk-only"><div><h1>{{ title }}</h1><p class="muted">{{ subtitle|default:clients_subtitle }}</p></div></header><section class="card m-bare"><div class="card-heading desk-only"><h2>Negocios</h2></div><form class="filters clients-filters desk-only" method="get" hx-get="{% url 'businesses' %}" hx-target="#clients-table" hx-swap="outerHTML" hx-push-url="true" hx-trigger="input from:#q delay:300ms, change from:#stage, change from:#category, change from:#open-now, submit"><div><label for="q">Buscar por nombre</label><input id="q" name="q" type="search" value="{{ query }}" autocomplete="off" placeholder="Escribe para filtrar"></div><div><label for="stage">Fase</label><select id="stage" name="stage"><option value="">Todas</option>{% for key,text in stages %}<option value="{{ key }}" {% if stage == key %}selected{% endif %}>{{ text }}</option>{% endfor %}</select></div><div><label for="category">Sector</label><select id="category" name="category"><option value="">Todos</option>{% for c in categories %}<option value="{{ c.pk }}" {% if category == c.pk|stringformat:'s' %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div><label class="check-inline" for="open-now"><input id="open-now" type="checkbox" name="abierto" value="1"{% if open_now %} checked{% endif %}> Abiertos ahora</label><input type="hidden" name="sort" value="{{ sort }}"><input type="hidden" name="lat"><input type="hidden" name="lng"><button type="button" class="secondary" data-near>{% icon 'map' 18 %}Cerca de mí</button><button class="secondary">Filtrar</button><p class="near-note muted" data-near-note hidden></p></form>
<form class="m-toolbar mob-only" method="get" hx-get="{% url 'businesses' %}" hx-target="#clients-table" hx-swap="outerHTML" hx-push-url="true" hx-trigger="input changed delay:300ms from:#m-q, search from:#m-q, change from:#m-stage-chips, change from:#m-quick-filters, submit"><input class="m-search" id="m-q" name="q" type="search" value="{{ query }}" placeholder="Buscar negocio" aria-label="Buscar por nombre" autocomplete="off" enterkeyhint="search"><div class="m-chips m-scroll" id="m-quick-filters"><label class="chip green"><input type="checkbox" name="abierto" value="1"{% if open_now %} checked{% endif %}>Abiertos ahora</label><button type="button" class="chip{% if near %} is-on{% endif %}" data-near>{% icon 'map' 16 %}Cerca de mí</button><input type="hidden" name="lat"><input type="hidden" name="lng"></div><p class="near-note muted" data-near-note hidden></p><div class="m-toolbar-row"><button type="button" class="secondary m-filter-btn" data-sheet-open="m-clients-sheet">{% icon 'filter' 18 %}Filtros<span data-filter-count="m-clients-sheet"></span></button><div class="m-chips m-scroll" id="m-stage-chips" role="radiogroup" aria-label="Fase"><label class="chip purple"><input type="radio" name="stage" value=""{% if not stage %} checked{% endif %}>Todas</label>{% for key,text in stages %}<label class="chip {{ key }}"><input type="radio" name="stage" value="{{ key }}"{% if stage == key %} checked{% endif %}>{{ text }}</label>{% endfor %}</div></div><dialog class="m-sheet" id="m-clients-sheet" aria-labelledby="m-clients-sheet-title"><div class="m-sheet-head"><h2 id="m-clients-sheet-title">Filtros</h2><button type="button" class="icon-btn" data-sheet-close aria-label="Cerrar">{% icon 'close' %}</button></div><label for="m-category">Sector</label><select id="m-category" name="category"><option value="">Todos</option>{% for c in categories %}<option value="{{ c.pk }}"{% if category == c.pk|stringformat:'s' %} selected{% endif %}>{{ c.name }}</option>{% endfor %}</select><label for="m-sort">Orden</label><select id="m-sort" name="sort" data-default="negocio"><option value="negocio"{% if sort == 'negocio' %} selected{% endif %}>Nombre, de la A a la Z</option><option value="-negocio"{% if sort == '-negocio' %} selected{% endif %}>Nombre, de la Z a la A</option><option value="fase"{% if sort == 'fase' %} selected{% endif %}>Fase</option><option value="-actividad"{% if sort == '-actividad' %} selected{% endif %}>Actividad más reciente</option><option value="proxima"{% if sort == 'proxima' %} selected{% endif %}>Próxima acción más cercana</option><option value="cerca"{% if sort == 'cerca' %} selected{% endif %}>Más cerca de mí</option></select><div class="m-sheet-actions"><button type="button" class="secondary" data-sheet-clear>Limpiar</button><button>Aplicar</button></div></dialog></form>{% include 'core/business_table.html' %}</section>{% endblock %}

<div class="barrio-field"><label for="{{ prefix }}barrio">Barrio</label><select id="{{ prefix }}barrio" name="barrio"><option value="">Toda la ciudad</option>{% for n in neighbourhoods %}<option value="{{ n.pk }}"{% if selected == n.pk|stringformat:'s' %} selected{% endif %}>{{ n.name }}{% if n.district %} ({{ n.district }}){% endif %}</option>{% endfor %}</select>{% if error %}<small class="muted">{{ error }}</small>{% elif not neighbourhoods %}<small class="muted">Sin barrios disponibles: se busca en toda la ciudad.</small>{% elif neighbourhoods.0.source == 'osm' %}<small class="muted">Barrios: © OpenStreetMap contributors (ODbL)</small>{% else %}<small class="muted">Barrios: Ayuntamiento de Madrid, datos abiertos</small>{% endif %}</div>

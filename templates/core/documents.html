<section class="card"><h2>Documentos</h2>{% for d in documents %}<p><a href="{% url 'document_download' d.public_id %}">{{ d.get_kind_display }}</a> <span class="chip">{{ d.get_status_display }}</span>{% if not preview %}{% if user.role == "admin" or user.role == "developer" %} <a href="{% url 'document_edit' d.public_id %}">Cambiar estado</a>{% endif %}{% endif %}</p>{% empty %}<p class="muted">No hay documentos.</p>{% endfor %}</section>

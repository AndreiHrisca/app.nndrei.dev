<details class="card fold" open{% if fold_closed %} data-m-closed{% endif %}><summary class="fold-head"><h2>Historial de actividad</h2></summary><ol class="timeline">{% for e in events %}<li><time>{{ e.occurred_at|date:'d/m/Y · H:i' }}</time><div>{{ e.text }}</div><small>{{ e.actor.name|default:'Sistema' }}</small></li>{% empty %}<li>Aquí aparecerán los avances del negocio.</li>{% endfor %}</ol></details>
